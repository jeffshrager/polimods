[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polimods"
version = "1.0.0"
description = "Adaptive two-party competition: a Python port of the NetLogo teaching model, with an experimental jig for parameter sweeps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7.0", "matplotlib>=3.6"]

[project.scripts]
polimods = "polimods.cli:main"
polimods-jig = "polimods.jig.cli:main"

[tool.setuptools.packages.find]
include = ["polimods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
